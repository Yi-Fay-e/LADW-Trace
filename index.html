    const MAIN_TABS = [
      {id:'event',name:'限定池'},{id:'rerun',name:'復刻池'},
      {id:'special',name:'特殊池'},{id:'standard',name:'常駐池'},
    ];

    function App() {
      const [view, setView] = useState('landing');
      const [activeTab, setActiveTab] = useState('event');
      const [filterChar, setFilterChar] = useState(null);
      const [activeQuote, setActiveQuote] = useState('');
      const [history, setHistory] = useState([]);
      const [selectedEventFilter, setSelectedEventFilter] = useState('all');
      const [pools, setPools] = useState({event:{pity:0},rerun:{pity:0},special:{pity:0},standard:{pity:0}});
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 20;
      const maxPity = 70;

      useEffect(() => {
        const h = storage.getHistory().sort((a,b) => {
          const da=new Date(a.eventDate||a.date), db=new Date(b.eventDate||b.date);
          if(db-da!==0) return db-da;
          return (b.date||"").localeCompare(a.date||"");
        });
        setHistory(h);
        setPools(storage.getPools());
      }, []);

      useEffect(() => {
        if(filterChar){
          const q=filterChar.quotes||[];
          if(q.length>0) setActiveQuote(q[Math.floor(Math.random()*q.length)]);
        } else setActiveQuote('');
      }, [filterChar]);

      const pityInfo = useMemo(() => {
        const ph=history.filter(r=>r.poolType===activeTab)
  .sort((a,b)=>{const da=new Date(a.eventDate||a.date),db=new Date(b.eventDate||b.date);return db-da;});
        if(ph.length===0) return {remaining:maxPity-(pools[activeTab]?.pity||0),accumulated:pools[activeTab]?.pity||0};
        return {remaining:ph[0].remainingAtRecord,accumulated:maxPity-ph[0].remainingAtRecord};
      }, [history,activeTab,pools]);

      const currentRemaining = pityInfo.remaining;

      const status = useMemo(() => {
        if(activeTab!=='event'&&activeTab!=='rerun') return {isGuaranteed:false,isTargetReady:false};
        const ph=history.filter(r=>r.poolType===activeTab&&r.recordType==='pull')
  .sort((a,b)=>{const da=new Date(a.eventDate||a.date),db=new Date(b.eventDate||b.date);return db-da;});
        if(ph.length===0) return {isGuaranteed:false,isTargetReady:false};
        const last=ph[0];
        return {isGuaranteed:last.isLost5050,isTargetReady:last.subPoolType==='multi'&&(last.isNotTarget||last.isLost5050)};
      }, [history,activeTab]);

      const eventAnalysis = useMemo(() => {
        if(selectedEventFilter==='all') return null;
        const evRecs=history.filter(r=>r.eventName===selectedEventFilter).sort((a,b)=>new Date(a.eventDate||a.date)-new Date(b.eventDate||b.date));
        const pulls=evRecs.filter(r=>r.recordType==='pull');
        const pities=evRecs.filter(r=>r.recordType==='pity');
        let total=0;

  // 合併歪卡+下一次的花費
  const mergedCosts=[];
  let pending=0;
  [...pulls].reverse().forEach(p=>{
    if(p.isLost5050){
      pending+=p.totalPulls;
    } else {
      mergedCosts.push(pending+p.totalPulls);
      pending=0;
    }
  });

  if(mergedCosts.length===0) return null;
  const total=mergedCosts.reduce((a,b)=>a+b,0);
  return{
    count:pulls.length,
    avg:Math.round(total/mergedCosts.length),
    best:Math.min(...mergedCosts),
    worst:Math.max(...mergedCosts),
  };

                      <div className="absolute top-4 right-4 z-20 flex gap-2">
                        <button onClick={(e)=>{e.stopPropagation();openEdit(record);}} className="p-1.5 bg-white/10 hover:bg-white/20 rounded-lg text-slate-300"><Edit2 size={14}/></button>
                        <button onClick={(e)=>{e.stopPropagation();setDeleteConfirmId(record.id);}} className="p-1.5 bg-rose-500/10 hover:bg-rose-500/20 rounded-lg text-rose-400"><Trash2 size={14}/></button>
                      </div>
                      <div className="flex justify-between items-start mb-3 relative z-10">
                        <div className="flex items-center gap-2">
                          <span className={`text-[11px] font-black uppercase px-2 py-0.5 rounded ${isPity?'bg-indigo-900/40 text-indigo-300':'bg-amber-500/20 text-amber-500'}`}>{isPity?(record.pityLabel||'墊池'):'出金'}</span>
                          <span className="text-[11px] font-black text-slate-400 uppercase">{record.poolType==='event'?(record.subPoolType==='multi'?'限定(混)':'限定(單)'):MAIN_TABS.find(t=>t.id===record.poolType)?.name}</span>
                        </div>
                        <span className="text-[11px] text-slate-500 font-bold flex items-center gap-1 mr-16"><Clock size={10}/> {record.eventDate}</span>
                      </div>
                      <div className="flex items-center gap-4 relative z-10">
                        <div className={`w-10 h-10 rounded-2xl bg-gradient-to-br ${charObj.solidColor} flex items-center justify-center shadow-lg text-white`}>{charObj.icon}</div>
                        <div className="flex-1 overflow-hidden">
                          <div className="flex flex-wrap items-center gap-2 mb-1">
                            <span className="font-black text-sm text-white">{charObj.name}</span>
                            <span className={`text-[11px] font-black px-1.5 rounded ${isPity?'text-slate-400 bg-slate-800':'text-black bg-amber-400'}`}>{isPity?`${record.totalPulls} 抽 (剩 ${record.remainingAtRecord})`:`第 ${record.totalPulls} 抽`}</span>
                            {record.isLost5050&&<span className="text-[9px] bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded font-black italic">歪卡</span>}
                            {showNotTargetTag&&<span className="text-[9px] bg-sky-500/10 text-sky-400 px-1.5 py-0.5 rounded font-black italic border border-sky-500/20">非定向</span>}
                            {showTargetTag&&<span className="text-[9px] bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded font-black italic border border-amber-500/30 flex items-center gap-0.5"><Crown size={8} fill="currentColor"/> 定向</span>}
                          </div>
                          <div className="flex items-center gap-1 mb-1"><Tag size={10} className="text-indigo-400 opacity-70"/><p className="text-[11px] font-black text-indigo-400/80 tracking-wider truncate uppercase">{record.eventName||'一般活動'}</p></div>
                          <div className="flex items-center gap-1.5">{record.cardType==='sun'?<Sun size={12} className="text-red-500"/>:<Moon size={12} className="text-sky-400"/>}<p className="text-[14px] font-bold text-slate-100 truncate leading-tight">{record.cardName}</p></div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {totalPages>1&&(
                <div className="mt-10 flex items-center justify-center gap-3">
                  <button onClick={()=>setCurrentPage(p=>Math.max(p-1,1))} disabled={currentPage===1} className={`p-2 rounded-xl ${currentPage===1?'text-slate-800 opacity-20':'text-slate-400 bg-white/5 active:scale-90'}`}><ChevronLeft size={16}/></button>
                  <div className="flex items-center gap-1">
                    {Array.from({length:totalPages},(_,i)=>i+1)
  .filter(page=>page===1||page===totalPages||Math.abs(page-currentPage)<=1)
  .reduce((acc,page,idx,arr)=>{
    if(idx>0&&page-arr[idx-1]>1)acc.push('...');
    acc.push(page);return acc;
  },[])
  .map((page,idx)=>
    page==='...'
      ?<span key={`dot-${idx}`} className="w-8 h-8 flex items-center justify-center text-slate-700 text-[11px]">…</span>
      :<button key={page} onClick={()=>setCurrentPage(page)} className={`w-8 h-8 rounded-lg text-[11px] font-black ${currentPage===page?'bg-indigo-600 text-white shadow-lg':'text-slate-600 hover:text-slate-400'}`}>{page}</button>
  )}
                  </div>
                  <button onClick={()=>setCurrentPage(p=>Math.min(p+1,totalPages))} disabled={currentPage===totalPages} className={`p-2 rounded-xl ${currentPage===totalPages?'text-slate-800 opacity-20':'text-slate-400 bg-white/5 active:scale-90'}`}><ChevronRight size={16}/></button>
                </div>
              )}
            </div>
          </main>
{deleteConfirmId&&(
  <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
    <div className="bg-[#0c0c16] border border-rose-500/30 rounded-[2rem] w-full max-w-xs p-8 shadow-2xl flex flex-col items-center gap-6">
      <div className="w-12 h-12 rounded-full bg-rose-500/20 border border-rose-500/40 flex items-center justify-center">
        <Trash2 size={20} className="text-rose-400"/>
      </div>
      <div className="text-center">
        <p className="text-white font-black text-sm tracking-widest mb-2">確認刪除？</p>
        <p className="text-slate-500 text-[11px]">此紀錄將永久移除，無法復原</p>
      </div>
      <div className="flex gap-3 w-full">
        <button onClick={()=>setDeleteConfirmId(null)} className="flex-1 py-3 rounded-xl bg-white/5 border border-white/10 text-slate-400 font-black text-[11px]">取消</button>
        <button onClick={(e)=>{deleteRecord(e,deleteConfirmId);setDeleteConfirmId(null);}} className="flex-1 py-3 rounded-xl bg-rose-500/80 border border-rose-500 text-white font-black text-[11px]">刪除</button>
      </div>
    </div>
  </div>
)}
          {isModalOpen&&(
            <div className="fixed inset-0 z-[100] flex items-end justify-center bg-black/90 backdrop-blur-md p-4">
              <div className="absolute inset-0" onClick={resetModal}></div>
              <div className="bg-[#0c0c16] border border-white/10 rounded-[3rem] w-full max-w-sm relative p-8 shadow-2xl overflow-y-auto max-h-[90vh] custom-scrollbar">
                <button onClick={resetModal} className="absolute left-6 top-8 text-slate-500 hover:text-white"><ChevronLeft size={24}/></button>
                <h3 className="text-lg font-black text-white tracking-widest mb-8 text-center mt-6">登錄思念紀錄</h3>
                <div className="space-y-6">
                  {activeTab==='event'&&(
                    <div>
                      <label className="text-[10px] text-slate-500 font-black uppercase mb-3 block tracking-widest text-center">限定池類型</label>
                      <div className="grid grid-cols-2 gap-3 p-1 bg-white/5 rounded-2xl border border-white/10">
                        <button onClick={()=>setSubPoolType('single')} className={`flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-black ${subPoolType==='single'?'bg-indigo-600 text-white':'text-slate-500'}`}><User size={12}/> 單人池</button>
                        <button onClick={()=>setSubPoolType('multi')} className={`flex items-center justify-center gap-2 py-2.5 rounded-xl text-[11px] font-black ${subPoolType==='multi'?'bg-indigo-600 text-white':'text-slate-500'}`}><Users size={12}/> 多人混池</button>
                      </div>
                    </div>
                  )}
                  <div>
                    <label className="text-[10px] text-slate-500 font-black uppercase mb-3 block tracking-widest text-center">紀錄性質</label>
                    <div className="grid grid-cols-2 gap-3 p-1 bg-white/5 rounded-2xl">
                      <button onClick={()=>setRecordType('pull')} className={`flex items-center justify-center gap-2 py-3 rounded-xl text-[12px] font-black ${recordType==='pull'?'bg-amber-500 text-black shadow-lg':'text-slate-500'}`}><Target size={14}/> 出金</button>
                      <button onClick={()=>setRecordType('pity')} className={`flex items-center justify-center gap-2 py-3 rounded-xl text-[12px] font-black ${recordType==='pity'?'bg-indigo-600 text-white shadow-lg':'text-slate-500'}`}><Zap size={14}/> 墊池</button>
                    </div>
                  </div>
                  <div>
                    <label className="text-[10px] text-slate-500 font-black uppercase mb-2 block tracking-widest">思念角色</label>
                    <div className="grid grid-cols-3 gap-2">
                      {CHARACTERS.map(c=><button key={c.id} onClick={()=>setSelectedChar(c.id)} className={`py-3 rounded-xl border text-[10px] font-black transition-all ${selectedChar===c.id?'bg-white/10 border-white/40 text-white shadow-lg':'bg-white/5 border-transparent text-slate-400'}`}>{c.name}</button>)}
                    </div>
                  </div>
                  <div>
                    <label className="text-[10px] text-slate-500 font-black uppercase mb-2 block tracking-widest">活動名稱</label>
                    <input type="text" list="existing-events" placeholder="例：他的邀約" value={eventName} onChange={(e)=>setEventName(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-[12px] text-slate-200 focus:outline-none"/>
                    <datalist id="existing-events">{eventOptions.filter(o=>o!=='all').map(o=><option key={o} value={o}/>)}</datalist>
                  </div>
                  <div className="flex gap-4 items-end">
                    <div className="w-1/3 flex-shrink-0">
                      <label className="text-[10px] text-slate-500 font-black uppercase mb-2 block tracking-widest">活動日期</label>
                      <input type="date" value={eventDate} onChange={(e)=>setEventDate(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl px-2 py-3 text-[11px] text-slate-200 focus:outline-none [color-scheme:dark]"/>
                    </div>
                    <div className="flex-1 flex flex-col items-center">
                      <label className="text-[10px] text-slate-500 font-black uppercase mb-2 block tracking-widest text-center">類型</label>
                      <div className="flex gap-2 p-1 bg-white/5 rounded-xl border border-white/10 w-fit">
                        <button onClick={()=>setCardType('sun')} className={`px-3 py-2 rounded-lg flex items-center gap-1.5 text-[10px] font-black ${cardType==='sun'?'bg-amber-500 text-black shadow-lg':'text-slate-500'}`}><Sun size={12}/> 日卡</button>
                        <button onClick={()=>setCardType('moon')} className={`px-3 py-2 rounded-lg flex items-center gap-1.5 text-[10px] font-black ${cardType==='moon'?'bg-sky-500 text-white shadow-lg':'text-slate-500'}`}><Moon size={12}/> 月卡</button>
                      </div>
                    </div>
                  </div>
                  <div>
                    <label className="text-[10px] text-slate-500 font-black uppercase mb-2 block tracking-widest">思念全名</label>
                    <input type="text" placeholder="例如：沈星回．心緒捕捉" value={cardName} onChange={(e)=>setCardName(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-[12px] text-slate-200 focus:outline-none"/>
                  </div>
                  {recordType==='pull'&&activeTab!=='standard'&&(
                    <div className="space-y-4">
                      <div className="flex items-center justify-between p-4 bg-rose-500/5 rounded-2xl border border-rose-500/20">
                        <span className="text-[12px] font-black text-rose-300">歪卡？</span>
                        <button onClick={()=>{setIsLost5050(!isLost5050);if(!isLost5050)setIsNotTarget(false);}} className={`px-4 py-1.5 rounded-full text-[11px] font-black ${isLost5050?'bg-rose-500 text-white shadow-lg':'text-slate-400'}`}>{isLost5050?'是的':'沒歪'}</button>
                      </div>
                      {subPoolType==='multi'&&!isLost5050&&(
                        <div className="flex items-center justify-between p-4 bg-sky-500/5 rounded-2xl border border-sky-500/20">
                          <span className="text-[12px] font-black text-sky-400">非定向限定卡？</span>
                          <button onClick={()=>setIsNotTarget(!isNotTarget)} className={`px-4 py-1.5 rounded-full text-[11px] font-black ${isNotTarget?'bg-sky-500 text-white shadow-lg':'text-slate-400'}`}>{isNotTarget?'是的':'定向中'}</button>
                        </div>
                      )}
                    </div>
                  )}
                  <div className="pt-4 border-t border-white/5 space-y-4">
                    <div>
                      <label className="text-[10px] text-slate-500 font-black uppercase mb-3 block tracking-widest text-center">選擇填寫方式</label>
                      <div className="relative">
                        <select value={inputMode} onChange={(e)=>setInputMode(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-[12px] font-black text-slate-200 outline-none appearance-none">
                          <option value="cost">花費抽數</option>
                          <option value="remain">剩餘抽數</option>
                        </select>
                        <ChevronDown size={14} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500"/>
                      </div>
                    </div>
                    <p className="text-[10px] text-slate-400 tracking-wide mt-1 px-1">
                   {inputMode==='cost'?'✦ 出金建議使用此模式':'✦ 墊池建議使用此模式'}
                   </p>
                    <div>
                      <label className="text-[10px] text-slate-500 font-black uppercase mb-2 block tracking-widest">{inputMode==='cost'?'花費抽數':'剩餘抽數'}</label>
                      <input type="number" value={inputMode==='cost'?pullCountInput:remainingPullsInput} onChange={(e)=>inputMode==='cost'?setPullCountInput(e.target.value):setRemainingPullsInput(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-[12px] text-slate-200 focus:outline-none"/>
                    </div>
                  </div>
                  <button onClick={submitRecord} className="w-full py-5 rounded-full bg-indigo-600 text-white font-black text-[11px] uppercase tracking-[0.3em] shadow-xl active:scale-95">確認登錄</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
